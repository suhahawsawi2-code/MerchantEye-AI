    const sl = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.05, 20), mats.sleeve); sl.position.y = 0.075; g.add(sl);
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.015, 20), mats.lid); lid.position.y = 0.145; g.add(lid);
    return g;
  })(),
};
const cupViews = [];
function syncCups() {
  for (const c of sim.cups) {
    let v = cupViews[c.id];
    if (!v) {
      v = cupGeo[c.style].clone(); v.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      scene.add(v); cupViews[c.id] = v;
    }
    v.visible = c.visible && !(c.holder && !c.holder.visible);
    if (c.holder) {
      const hv = views[c.holder.id];
      const hand = hv.bm.RightHand;
      hand.getWorldPosition(v1);
      v.position.set(v1.x, v1.y - 0.09, v1.z);
      v.rotation.set(0, 0, 0);
    } else {
      v.position.set(c.x, c.y, c.z);
    }
  }
}

const UP = new THREE.Vector3(0, 1, 0), DOWN = new THREE.Vector3(0, -1, 0);
const fwd = new THREE.Vector3();
function syncAgents(dt) {
  for (const v of views) {
    const a = v.a;
    v.lift.visible = a.visible;
    if (!a.visible) continue;
    // walk/idle blend
    const target = a.anim === 'walk' ? 1 : 0;
    v.wWalk += Math.sign(target - v.wWalk) * Math.min(Math.abs(target - v.wWalk), dt / 0.25);
    v.walk.setEffectiveWeight(v.wWalk);
    v.idle.setEffectiveWeight(1 - v.wWalk);
    v.walk.setEffectiveTimeScale((a.moveSpeed || 1.2) / 1.25 * (1 / v.scale > 0 ? 1 : 1));
    v.mixer.update(dt);
    v.lift.position.set(a.x, 0, a.z);
    v.lift.rotation.y = a.heading;
    v.lift.updateMatrixWorld(true);
    if (a.sit > 0) {
      const w = a.sit;
      fwd.set(Math.sin(a.heading), 0, Math.cos(a.heading));
      const bm = v.bm;
      for (const side of ['Left', 'Right']) {
        const thigh = fwd.clone().multiplyScalar(0.97).add(new THREE.Vector3(0, -0.12, 0)).normalize();
        aim(bm[side + 'UpLeg'], bm[side + 'Leg'], thigh, w);
        aim(bm[side + 'Leg'], bm[side + 'Foot'], DOWN.clone().add(fwd.clone().multiplyScalar(0.12)).normalize(), w);
      }
      // forearms resting toward the table
      for (const side of ['Left', 'Right']) {
        aim(bm[side + 'ForeArm'], bm[side + 'Hand'], fwd.clone().add(new THREE.Vector3(0, -0.25, 0)).normalize(), 0.7 * w);
      }
      const seatH = 0.53;
      v.lift.position.y = -(v.hipsY - seatH) * w;
      // move the hips back over the chair seat: feet end up in front of the chair
      v.lift.position.x -= fwd.x * 0.12 * w;
      v.lift.position.z -= fwd.z * 0.12 * w;
      v.lift.updateMatrixWorld(true);
    }
  }
}

// ---------------------------------------------------------------- zones (projected to normalized image rectangles)
function projRect(pts) {
  let x1 = 1, y1 = 1, x2 = 0, y2 = 0;
  for (const [x, y, z] of pts) {
    const p = new THREE.Vector3(x, y, z).project(camera);
    const u = (p.x + 1) / 2, w = (1 - p.y) / 2;
    x1 = Math.min(x1, u); x2 = Math.max(x2, u); y1 = Math.min(y1, w); y2 = Math.max(y2, w);
  }
  const c = (v) => Math.round(Math.min(1, Math.max(0, v)) * 10000) / 10000;
  return { x1: c(x1), y1: c(y1), x2: c(x2), y2: c(y2) };
}
const floorBox = (x1, x2, z1, z2, y1 = 0, y2 = 0) => {
  const pts = [];
  for (const x of [x1, x2]) for (const z of [z1, z2]) for (const y of [y1, y2]) pts.push([x, y, z]);
  return projRect(pts);
};
window.zones = () => ({
  queue: [floorBox(-3.95, -2.8, -2.7, 1.75)],
  pickup: [floorBox(-1.35, 0.95, -2.75, -1.85)],
  door: [floorBox(3.4, 4.8, -4.7, -3.3)],
  staff: [floorBox(-4.6, 1.1, -4.4, -3.5, 1.25, 1.95)],
  tables: L.tables.map((t) => floorBox(t.x - 0.85, t.x + 0.85, t.z - 0.35, t.z + 0.45, 0, 0.0)),
});
window.project = (x, y, z) => { const p = new THREE.Vector3(x, y, z).project(camera); return [(p.x + 1) / 2, (1 - p.y) / 2]; };

// ---------------------------------------------------------------- frame API
let frame = 0;
window.advance = (n) => { for (let i = 0; i < n; i++) { sim.step(); syncAgents(sim.dt); frame++; } };
window.render = (q = 0.92) => {
  syncCups();
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', q);
};
window.gt = () => sim.gt;
window.simT = () => sim.t;
window.agentsNow = () => sim.agents.filter((a) => a.visible).map((a) => ({ id: a.id, kind: a.kind, x: a.x, z: a.z, sit: a.sit }));
window.ready = true;
</script></body></html>
